name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Webflow links blog-embeds.css through jsDelivr, which caches @main for
      # up to 12 hours. Purging on merge means a restyle reaches the live blog
      # in seconds instead of overnight. Non-fatal if the endpoint is down.
      - name: Purge jsDelivr cache (blog-embeds.css)
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/src/webflow-embeds/blog-embeds.css" || true

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Storybook's Vite build strips types with esbuild and never checks them,
      # so a type error would otherwise reach main and deploy silently.
      - run: pnpm typecheck

      - run: pnpm build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
